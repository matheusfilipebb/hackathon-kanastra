services:
  back:
    build: ./back
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-2}
      UPLOAD_RATE_LIMIT: ${UPLOAD_RATE_LIMIT:-10}
      UPLOAD_RATE_WINDOW_SECONDS: ${UPLOAD_RATE_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:${BACK_PORT:-3000}:3000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/validadores').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
  front:
    build: ./front
    restart: unless-stopped
    ports:
      - "${FRONT_HOST:-0.0.0.0}:${FRONT_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      back:
        condition: service_healthy
volumes:
  backend_data:
